# Experiment: YOLO11n-SA-DWPN-B
# Goal: C2-guided P3 detail injection with scene-adaptive dynamic weighted fusion
# Detect heads: 3, P3/P4/P5
# No P2 detection head
# Spatial gate: disabled
# Intended training imgsz: 640

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-C2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-C3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-C4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10-C5/32

head:
  - [2, 1, Conv, [256, 1, 1]] # 11-L2/4
  - [-1, 1, DWDown, [256]] # 12-D2/8
  - [4, 1, Conv, [256, 1, 1]] # 13-L3/8
  - [6, 1, Conv, [512, 1, 1]] # 14-L4/16
  - [10, 1, Conv, [1024, 1, 1]] # 15-L5/T5/32

  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 16-Up(T5)/16
  - [-1, 1, Conv, [512, 1, 1]] # 17-Up(T5) aligned to L4
  - [[14, 17], 1, SDWF, [512, 2, True, False]] # 18-T4/16 = SDWF([L4, Up(T5)])

  - [18, 1, nn.Upsample, [None, 2, "nearest"]] # 19-Up(T4)/8
  - [-1, 1, Conv, [256, 1, 1]] # 20-Up(T4) aligned to L3
  - [[13, 20, 12], 1, SDWF, [256, 3, True, False]] # 21-T3/8 = SDWF([L3, Up(T4), D2])
  - [[13, 21, 12], 1, SDWF, [256, 3, True, False]] # 22-O3/8 = SDWF([L3, T3, D2])

  - [22, 1, Conv, [512, 3, 2]] # 23-Down(O3)/16
  - [[14, 18, 23], 1, SDWF, [512, 3, True, False]] # 24-O4/16 = SDWF([L4, T4, Down(O3)])

  - [24, 1, Conv, [1024, 3, 2]] # 25-Down(O4)/32
  - [[15, 25], 1, SDWF, [1024, 2, True, False]] # 26-O5/32 = SDWF([L5, Down(O4)])

  - [[22, 24, 26], 1, Detect, [nc]] # 27-Detect(P3, P4, P5)
