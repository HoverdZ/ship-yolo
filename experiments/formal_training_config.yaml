schema_version: 1
protocol_id: ocean_engineering_formal_v1
selection:
  split: val
  metric: metrics/mAP50-95(B)
  checkpoint: best.pt
  test_for_model_selection: false

environment:
  python: 3.12.x
  ultralytics: 8.4.92
  torch: record_from_colab_runtime
  cuda: record_from_colab_runtime
  gpu: record_from_colab_runtime
  enforce_shared_environment_lock: true

dataset:
  dataset_id: primary_ship_v1
  data_yaml: /content/drive/MyDrive/ship_detection/data/data.yaml
  drive_root: /content/drive/MyDrive/ship_detection/data
  local_root: /content/ship_detection/data
  local_data_yaml: /content/ship_detection/data_runtime.yaml
  source_read_only: true
  copy_workers: 32
  frozen_split: true
  expected_class_names: [ship]
  expected_counts_are_informational_only: true

training:
  imgsz: 640
  epochs: 150
  batch: 8
  workers: 2
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 100
  seed: 0
  seeds: [0, 1, 2]
  stability_targets: [R00, R02, R10]
  device: 0
  cache: disk
  deterministic: false
  pretrained: true
  save_period: 10
  plots: true
  mosaic: 1.0
  close_mosaic: 10
  scale: 0.5
  translate: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  remaining_arguments: Ultralytics 8.4.92 defaults

initialization:
  yolo11: yolo11n.pt
  yolov8: yolov8n.pt
  staged_ablation_checkpoints_prohibited: true
  policy: audited semantic-layer and same-shape transfer from the matching official checkpoint
  trainer_handoff: exact pre-epoch tensor assertion

outputs:
  local_root: /content/formal_runs
  drive_project_root: /content/drive/MyDrive/ship_detection/paper_project
  drive_experiment_root: /content/drive/MyDrive/ship_detection/paper_project/formal_experiments
  repository_snapshots: /content/drive/MyDrive/ship_detection/paper_project/repository_snapshots
  paper_artifacts: /content/drive/MyDrive/ship_detection/paper_project/paper_artifacts
  exports: /content/drive/MyDrive/ship_detection/paper_project/exports
  realtime_sync: true
  sync_each_epoch: true
  atomic_replace: true

runtime:
  run_training_default: false
  run_test_evaluation_default: false
  foreground_training_only: true
  subprocess_training_prohibited: true
