schema_version: 1
registry_id: pls_scam_family_v1
base_run: R01
shared:
  initialization_weight: yolo11n.pt
  epochs: 150
  imgsz: 640
  batch: 8
  seed: 0
  upsampling: nearest
  expected_detect_strides: [4, 8, 16]
experiments:
  PLS_CA_SCAM_150ep:
    model_yaml: experiments/pls_scam_family/PLS_CA_SCAM_yolo11n.yaml
    description: PLS with three complete bounded CA-SCAM modules before Detect.
    modules: {pls: true, scam: false, ca_scam: bounded, vgup: false, erup: false}
    output_drive_dir: formal_experiments/PLS_CA_SCAM_150ep/seed_0
    notebook_path: notebooks/formal/PLS_CA_SCAM_150ep.ipynb
  PLS_SCAM_150ep:
    model_yaml: experiments/pls_scam_family/PLS_SCAM_yolo11n.yaml
    description: PLS with three original FFCA-YOLO SCAM modules before Detect.
    modules: {pls: true, scam: true, ca_scam: false, vgup: false, erup: false}
    output_drive_dir: formal_experiments/PLS_SCAM_150ep/seed_0
    notebook_path: notebooks/formal/PLS_SCAM_150ep.ipynb
  PLS_CA_SCAM_VGUP_150ep:
    model_yaml: experiments/pls_scam_family/PLS_CA_SCAM_VGUP_yolo11n.yaml
    description: Complete VGUP input preprocessing followed by PLS and three bounded CA-SCAM modules.
    modules: {pls: true, scam: false, ca_scam: bounded, vgup: true, erup: false}
    output_drive_dir: formal_experiments/PLS_CA_SCAM_VGUP_150ep/seed_0
    notebook_path: notebooks/formal/PLS_CA_SCAM_VGUP_150ep.ipynb
  PLS_CA_SCAM_ERUP_150ep:
    model_yaml: experiments/pls_scam_family/PLS_CA_SCAM_ERUP_yolo11n.yaml
    description: ERUP input preprocessing followed by PLS and three bounded CA-SCAM modules.
    modules: {pls: true, scam: false, ca_scam: bounded, vgup: false, erup: true}
    output_drive_dir: formal_experiments/PLS_CA_SCAM_ERUP_150ep/seed_0
    notebook_path: notebooks/formal/PLS_CA_SCAM_ERUP_150ep.ipynb
