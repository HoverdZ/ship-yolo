# YOLO11n-InceptionDW-FaPN
# Keeps the validated InceptionDW backbone layers 2/4 unchanged and uses the
# exact same original FaPN top-down/PAN/Detect topology as yolo11n_fapn.yaml.

nc: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_InceptionDW, [256, False, 0.25]] # validated layer 2 replacement
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_InceptionDW, [512, False, 0.25]] # validated layer 4 replacement/C3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-C4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10-C5

head:
  # Identical original FaPN top-down recursion to yolo11n_fapn.yaml.
  - [-1, 1, FaPNLateral, [256]] # 11: C5 -> M5
  - [[6, 11], 1, FaPNAlign, [256]] # 12: [C4, M5] -> M4
  - [12, 1, FaPNOutputConv, [256]] # 13: M4 -> T4
  - [[4, 12], 1, FaPNAlign, [256]] # 14: [C3, M4] -> M3 (not T4)
  - [14, 1, FaPNOutputConv, [256]] # 15: M3 -> T3

  # Official YOLO11 bottom-up PAN topology, identical to FaPN-only.
  - [15, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 13], 1, Concat, [1]] # 17: concat T4
  - [-1, 2, C3k2, [512, False]] # 18-P4
  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 10], 1, Concat, [1]] # 20: original C5/C2PSA, not M5
  - [-1, 2, C3k2, [1024, True]] # 21-P5
  - [[15, 18, 21], 1, Detect, [nc]] # 22: Detect(P3, P4, P5)
