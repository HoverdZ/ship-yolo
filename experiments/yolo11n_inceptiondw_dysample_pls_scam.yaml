# YOLO11n + InceptionDW + DySample + PLS + three independent SCAM blocks.
# Detect consumes SCAM-refined P2/P3/P4 at strides 4/8/16.

nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2_InceptionDW, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_InceptionDW, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  - [-1, 1, DySample, [2, "lp", 4, False]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, DySample, [2, "lp", 4, False]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [14, 1, SCAM, [1]]
  - [17, 1, SCAM, [1]]
  - [20, 1, SCAM, [1]]
  - [[21, 22, 23], 1, Detect, [nc]]
