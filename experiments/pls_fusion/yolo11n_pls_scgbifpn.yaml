# YOLO11n + PLS P2/P3/P4 pyramid + SCGBiFPN-style spatial-context fusion.
nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  # Top-down semantic path: P4 -> P3 -> P2.
  - [[4, 8], 1, SCGBiFPNFusion, [0, 512]]
  - [[2, 9], 1, SCGBiFPNFusion, [0, 256]]
  # Bottom-up path with direct raw-P2 spatial-context skips into P3 and P4.
  - [[2, 10, 9, 8], 1, SCGBiFPNFusion, [2, 512]]
  - [[2, 10, 11, 8], 1, SCGBiFPNFusion, [3, 512]]
  - [[10, 11, 12], 1, Detect, [nc]]
