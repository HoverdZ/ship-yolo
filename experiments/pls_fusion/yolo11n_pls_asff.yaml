# YOLO11n + PLS P2/P3/P4 pyramid + ASFF spatial fusion.
nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  - [[2, 4, 8], 1, PLSASFF, [0, 256]]
  - [[2, 4, 8], 1, PLSASFF, [1, 512]]
  - [[2, 4, 8], 1, PLSASFF, [2, 512]]
  - [[9, 10, 11], 1, Detect, [nc]]
