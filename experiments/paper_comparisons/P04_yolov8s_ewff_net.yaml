# P04: paper-level E-WFF Net architecture reproduction (Remote Sensing, 2025).
# The paper's angle-dependent elliptical rotation is intentionally disabled:
# the controlled dataset contains horizontal YOLO boxes without orientation.
nc: 80
scale: s
paper_method: E-WFF-Net
paper_loss: ciou
elliptical_rotation: disabled_missing_oriented_labels
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, DATBlock, [8, 2, 2.0]]
  - [-1, 1, SimSPPF, [1024, 5]]

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [6, 1, Conv, [512, 1, 1]]
  - [[13, 12], 1, WeightedFeatureFusion, [512, 0]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [4, 1, Conv, [256, 1, 1]]
  - [[16, 15], 1, WeightedFeatureFusion, [256, 0]]
  - [2, 1, Conv, [256, 3, 2]]
  - [[18, 4, 17], 1, WeightedFeatureFusion, [256, 0]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[6, 14, 20], 1, WeightedFeatureFusion, [512, 0]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [10, 1, Conv, [1024, 1, 1]]
  - [[23, 22], 1, WeightedFeatureFusion, [1024, 0]]
  - [[19, 21, 24], 1, Detect, [nc]]
