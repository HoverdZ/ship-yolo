# YOLO11n-FaPN-Prefusion
# Official YOLO11n with FaPN selection/alignment before the unchanged YOLO
# nearest-upsample + Concat + C3k2 fusion. Ultralytics 8.4.92, nc=1.

nc: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-C3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-C4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10-C5

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 11: C5 -> U5
  - [6, 1, FaPNFeatureSelectionKeep, [0.1]] # 12: C4 -> S4
  - [[12, 11], 1, FaPNAlignmentOnly, [64, 8, 0.1]] # 13: [S4,U5] -> A5
  - [[12, 13], 1, Concat, [1]] # 14: unchanged YOLO concat
  - [-1, 2, C3k2, [512, False]] # 15: unchanged top-down T4

  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 16: T4 -> U4
  - [4, 1, FaPNFeatureSelectionKeep, [0.1]] # 17: C3 -> S3
  - [[17, 16], 1, FaPNAlignmentOnly, [64, 8, 0.1]] # 18: [S3,U4] -> A4
  - [[17, 18], 1, Concat, [1]] # 19: unchanged YOLO concat
  - [-1, 2, C3k2, [256, False]] # 20: unchanged top-down T3

  - [-1, 1, Conv, [256, 3, 2]] # 21: unchanged PAN
  - [[-1, 15], 1, Concat, [1]] # 22: concat T4
  - [-1, 2, C3k2, [512, False]] # 23-P4
  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 10], 1, Concat, [1]] # 25: concat original C5/C2PSA
  - [-1, 2, C3k2, [1024, True]] # 26-P5
  - [[20, 23, 26], 1, Detect, [nc]] # 27: Detect(P3, P4, P5)
