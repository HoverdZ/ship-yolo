# R12: YOLOv8n-native InceptionDW + DPLS + bounded CA-SCAM + complete VGUP.
# P2/P3 C2f keeps its native topology and first Bottleneck 3x3 convolution;
# only the second Bottleneck 3x3 convolution is replaced by InceptionDW.
nc: 80
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, VGUPPreprocessor, [8, 128, true, true]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_InceptionDW, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f_InceptionDW, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, SPPF, [512, 5]]

head:
  - [-1, 1, DySample, [2, lp, 4, false]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, DySample, [2, lp, 4, false]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [14, 1, CASCAM, [0.1]]
  - [17, 1, CASCAM, [0.1]]
  - [20, 1, CASCAM, [0.1]]
  - [[21, 22, 23], 1, Detect, [nc]]
