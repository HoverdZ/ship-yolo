protocol: formal_ablation_v1
selection_split: val
selection_metric: metrics/mAP50-95(B)
test_evaluation_default: false
environment:
  python: 3.12.x
  ultralytics: 8.4.92
training:
  epochs: 150
  imgsz: 640
  batch: 8
  workers: 2
  seed: 0
  cache: disk
  deterministic: false
  device: 0
  plots: true
  save: true
  save_period: 10
  remaining_arguments: Ultralytics 8.4.92 defaults, identical for all six runs
initialization:
  weights: yolo11n.pt
  policy: official weights only; same-name/same-shape transfer with an audited source-key layer shift for input preprocessors
  staged_checkpoints_prohibited: true
dataset:
  drive_yaml: /content/drive/MyDrive/ship_detection/data/data.yaml
  local_root: /content/datasets/ship_clean_v1
  source_is_read_only: true
  clean_or_repartition: false
outputs:
  local_root: /content/formal_runs
  drive_root: /content/drive/MyDrive/ShipPaper/formal_ablation_v1
experiments:
  A0_yolo11n: experiments/formal_ablation_v1/A0_yolo11n.yaml
  A1_inceptiondw: experiments/formal_ablation_v1/A1_inceptiondw.yaml
  A2_inceptiondw_dpls: experiments/formal_ablation_v1/A2_inceptiondw_dpls.yaml
  A3_inceptiondw_dpls_scam: experiments/formal_ablation_v1/A3_inceptiondw_dpls_scam.yaml
  A4_inceptiondw_dpls_scam_vgup: experiments/formal_ablation_v1/A4_inceptiondw_dpls_scam_vgup.yaml
  A5_inceptiondw_dpls_ca_scam_vgup: experiments/formal_ablation_v1/A5_inceptiondw_dpls_ca_scam_vgup.yaml
