# Unified protocol for formal SA-DWPN ablation experiments.

training:
  imgsz: 640
  epochs: 150
  batch: 8
  device: 0
  workers: 2
  seed: 0
  deterministic: true
  amp: true
  cache: false
  patience: 150
  save: true
  save_period: 5
  plots: true
  verbose: true

initialization:
  pretrained: true
  official_weights: yolo11n.pt
  use_b_best_pt: false
  note: "Formal ablations start from the same official YOLO11n checkpoint."

constraints:
  no_p2_detection_head: true
  detect_heads: [P3, P4, P5]
  same_dataset_splits: true
  same_augmentation_defaults: true
  same_optimizer_policy: true
  same_ultralytics_version: true
  one_structural_variable_changed_per_ablation: true

artifact_policy:
  save_args_yaml: true
  save_results_csv: true
  save_summary_json: true
  save_experiment_note: true
  do_not_commit_weights: true
  do_not_commit_datasets: true

unknowns:
  optimizer: "Use resolved Ultralytics args.yaml from each run; do not infer here."
  augmentation: "Use resolved Ultralytics args.yaml from each run; do not infer here."
  loss: "No custom loss changes in SA-DWPN ablations."
