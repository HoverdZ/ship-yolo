protocol: inceptiondw_scshared_head_screening_v1
ultralytics_version: 8.4.92
baseline:
  experiment: yolo11n_inceptiondw_c3k2_p23_640
  existing_best_map50_95: 0.33258
  reuse_existing_150_epoch_run: true
  comparison_window_epochs: 80
  existing_first80_best_map50_95: 0.30168
model:
  experiment: yolo11n_inceptiondw_scshared_head_640
  backbone_changes: [C3k2_InceptionDW_at_layers_2_4]
  neck_changes: none
  head: SCSharedDetect
  detect_scales: [P3, P4, P5]
  detect_strides: [8, 16, 32]
  shared_channels: 64
  shared_blocks: 2
  normalization: GroupNorm
  scale_calibration: independent_positive_scalar_per_level
  dcn: false
  attention: false
  loss_changes: none
screening:
  stage_epochs: 80
  scheduler_total_epochs: 150
  initialization: yolo11n.pt
  imgsz: 640
  batch: 8
  workers: 2
  device: "0"
  seed: 0
  optimizer: auto
continuation:
  start_epoch: 81
  final_total_epochs: 150
  checkpoint: weights/stage80_resume.pt
  require_optimizer_state: true
  require_ema_state: true
  require_same_scheduler_horizon: true
decision_gate:
  best_map50_95_minimum: 0.305
  last20_mean_map50_95_minimum: 0.277
  map50_drop_tolerance: 0.005
  decision_requires_curve_review: true
dataset:
  drive_path: /content/drive/MyDrive/ship_detection/data
  local_path: /content/datasets/ship_detection
  fixed_count_gate: false
  copy_method: threaded_shutil_copyfile
  live_progress: [files, bytes, throughput, eta]
guardrails:
  no_p2_detect_head: true
  no_neck_change: true
  no_dcn: true
  no_loss_change: true
  no_subprocess_training: true
  no_formal_training_during_preparation: true
